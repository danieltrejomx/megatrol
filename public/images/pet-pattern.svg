<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" fill="none">
  <!-- Minimalist, discreet pet pattern for Megatrol (Perritos y Gatitos en secuencia) -->
  <style>
    .pet-icon {
      color: #0084c7;
      opacity: 0.075;
    }
    .pet-accent {
      color: #74c043;
      opacity: 0.07;
    }
  </style>

  <!-- 1. PERRITO (Puppy face - top left) -->
  <g class="pet-icon" transform="translate(20, 16)">
    <!-- Floppy Left Ear -->
    <path d="M 9 12 C 4 14, 1 23, 4 29 C 7 34, 12 32, 13 25 Z" fill="currentColor" />
    <!-- Floppy Right Ear -->
    <path d="M 31 12 C 36 14, 39 23, 36 29 C 33 34, 28 32, 27 25 Z" fill="currentColor" />
    <!-- Head Outline -->
    <ellipse cx="20" cy="21" rx="14" ry="12.5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" />
    <!-- Eyes -->
    <circle cx="15" cy="19" r="1.7" fill="currentColor" />
    <circle cx="25" cy="19" r="1.7" fill="currentColor" />
    <!-- Muzzle / Snout -->
    <ellipse cx="20" cy="24" rx="3.2" ry="2.3" fill="currentColor" />
    <!-- Cute smile -->
    <path d="M 18 27 C 19 28.5, 21 28.5, 22 27" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- 2. GATITO (Kitten face - top right) -->
  <g class="pet-icon" transform="translate(100, 16)">
    <!-- Left Pointy Ear -->
    <path d="M 10 14 L 6 3 L 18 9" fill="currentColor" fill-opacity="0.25" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round" />
    <!-- Right Pointy Ear -->
    <path d="M 30 14 L 34 3 L 22 9" fill="currentColor" fill-opacity="0.25" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round" />
    <!-- Head Outline -->
    <circle cx="20" cy="22" r="13" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" />
    <!-- Eyes -->
    <circle cx="15" cy="20.5" r="1.7" fill="currentColor" />
    <circle cx="25" cy="20.5" r="1.7" fill="currentColor" />
    <!-- Tiny Triangular Nose -->
    <polygon points="18.8,24 21.2,24 20,25.5" fill="currentColor" />
    <!-- Whiskers Left -->
    <path d="M 12 24 L 4 23 M 12 26 L 5 27.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
    <!-- Whiskers Right -->
    <path d="M 28 24 L 36 23 M 28 26 L 35 27.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
  </g>

  <!-- 3. HUELLITA (Paw print - bottom left) -->
  <g class="pet-accent" transform="translate(22, 96)">
    <!-- Main Pad -->
    <path d="M 13 23 C 13 19, 17 17, 20 17 C 23 17, 27 19, 27 23 C 27 27, 24 29, 20 29 C 16 29, 13 27, 13 23 Z" fill="currentColor" />
    <!-- 4 Toe pads -->
    <ellipse cx="12" cy="14" rx="2.2" ry="3.2" transform="rotate(-20 12 14)" fill="currentColor" />
    <ellipse cx="17" cy="11.5" rx="2.2" ry="3.2" transform="rotate(-6 17 11.5)" fill="currentColor" />
    <ellipse cx="23" cy="11.5" rx="2.2" ry="3.2" transform="rotate(6 23 11.5)" fill="currentColor" />
    <ellipse cx="28" cy="14" rx="2.2" ry="3.2" transform="rotate(20 28 14)" fill="currentColor" />
  </g>

  <!-- 4. HUESITO / BONE & CORAZÓN (Pet love - bottom right) -->
  <g class="pet-accent" transform="translate(102, 98)">
    <!-- Bone -->
    <path d="M 9 19 C 7.5 17.5, 7.5 15, 9 13.5 C 10.5 12, 13 12.5, 14 14 L 24 19 C 25 17.5, 27.5 17, 29 18.5 C 30.5 20, 30.5 22.5, 29 24 C 30.5 25.5, 30 28, 28.5 29 C 27 30, 24.5 29.5, 23.5 28 L 13.5 23 C 12.5 24.5, 10 25, 8.5 23.5 C 7 22, 7.5 19.5, 9 19 Z" fill="currentColor" />
  </g>

  <!-- 5. SUBTLE ORGANIC ACCENTS (Floating heart & little stars / sparkles) -->
  <!-- Tiny heart in middle -->
  <g class="pet-icon" transform="translate(73, 72) scale(0.65)">
    <path d="M 12 7 C 8.5 1.5, 2 5, 2 10.5 C 2 16, 12 21, 12 21 C 12 21, 22 16, 22 10.5 C 22 5, 15.5 1.5, 12 7 Z" fill="currentColor" />
  </g>

  <!-- Tiny sparkle top-middle -->
  <g class="pet-accent" transform="translate(78, 24)">
    <circle cx="0" cy="0" r="1.6" fill="currentColor" />
  </g>

  <!-- Tiny sparkle bottom-middle -->
  <g class="pet-icon" transform="translate(78, 140)">
    <circle cx="0" cy="0" r="1.6" fill="currentColor" />
  </g>

  <!-- Tiny paw print accent right edge -->
  <g class="pet-icon" transform="translate(146, 75) scale(0.45)">
    <path d="M 13 23 C 13 19, 17 17, 20 17 C 23 17, 27 19, 27 23 C 27 27, 24 29, 20 29 C 16 29, 13 27, 13 23 Z" fill="currentColor" />
    <circle cx="12" cy="14" r="2.2" fill="currentColor" />
    <circle cx="17" cy="11.5" r="2.2" fill="currentColor" />
    <circle cx="23" cy="11.5" r="2.2" fill="currentColor" />
    <circle cx="28" cy="14" r="2.2" fill="currentColor" />
  </g>
  <!-- Tiny paw print accent left edge -->
  <g class="pet-icon" transform="translate(-6, 75) scale(0.45)">
    <path d="M 13 23 C 13 19, 17 17, 20 17 C 23 17, 27 19, 27 23 C 27 27, 24 29, 20 29 C 16 29, 13 27, 13 23 Z" fill="currentColor" />
    <circle cx="12" cy="14" r="2.2" fill="currentColor" />
    <circle cx="17" cy="11.5" r="2.2" fill="currentColor" />
    <circle cx="23" cy="11.5" r="2.2" fill="currentColor" />
    <circle cx="28" cy="14" r="2.2" fill="currentColor" />
  </g>
</svg>