<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240" fill="none">
  <!-- Minimalist Brand Imprint Pattern for Megatrol (Subtle, minimalist, non-saturated) -->
  <style>
    .brand-blue {
      fill: #0084c7;
      stroke: #0084c7;
      opacity: 0.045;
    }
    .brand-green {
      fill: #74c043;
      stroke: #74c043;
      opacity: 0.042;
    }
    .brand-text {
      fill: #0084c7;
      opacity: 0.045;
      font-family: 'Outfit', 'Inter', system-ui, -apple-system, sans-serif;
      font-weight: 800;
      letter-spacing: 4px;
      font-size: 11px;
    }
  </style>

  <!-- 1. MEGATROL Wordmark (top-left quadrant) -->
  <g transform="translate(24, 36)">
    <text class="brand-text" x="0" y="0">MEGATROL</text>
  </g>

  <!-- 2. Minimalist Botanical Leaf Sprig (top-right quadrant) -->
  <g class="brand-green" transform="translate(165, 18)">
    <!-- Central leaf -->
    <path d="M 12 2 C 22 7, 25 20, 12 28 C 3 20, 6 7, 12 2 Z" fill="currentColor" stroke="none" />
    <!-- Leaf stem -->
    <path d="M 12 2 L 12 28" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" />
    <!-- Secondary small leaf -->
    <path d="M 19 16 C 25 16, 27 22, 21 25 C 17 23, 17 18, 19 16 Z" fill="currentColor" stroke="none" />
  </g>

  <!-- 3. Geometric Minimalist Paw Print (bottom-left quadrant) -->
  <g class="brand-blue" transform="translate(30, 138)">
    <!-- Main pad -->
    <path d="M 10 18 C 10 13.5, 14 11.5, 18 11.5 C 22 11.5, 26 13.5, 26 18 C 26 22.5, 22 24.5, 18 24.5 C 14 24.5, 10 22.5, 10 18 Z" fill="currentColor" stroke="none" />
    <!-- 4 neat circular toe pads -->
    <circle cx="9" cy="7.5" r="2.3" fill="currentColor" stroke="none" />
    <circle cx="15" cy="4.5" r="2.5" fill="currentColor" stroke="none" />
    <circle cx="21" cy="4.5" r="2.5" fill="currentColor" stroke="none" />
    <circle cx="27" cy="7.5" r="2.3" fill="currentColor" stroke="none" />
  </g>

  <!-- 4. Monogram "M" Circular Seal (bottom-right quadrant) -->
  <g class="brand-blue" transform="translate(156, 135)">
    <!-- Subtle circular frame -->
    <circle cx="18" cy="18" r="16" fill="none" stroke="currentColor" stroke-width="1.2" />
    <!-- Stylized 'M' with botanical ribbon -->
    <path d="M 10 24 L 10 12 L 18 19 L 26 12 L 26 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- 5. Tiny discreet organic micro-accents -->
  <circle class="brand-green" cx="120" cy="85" r="1.3" fill="currentColor" stroke="none" />
  <circle class="brand-blue" cx="120" cy="205" r="1.3" fill="currentColor" stroke="none" />
</svg>